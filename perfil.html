<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brush | Perfil</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: 'Times New Roman', serif; }
.bg-gradient { background: linear-gradient(135deg, #1e3a8a, #64748b); }
</style>
</head>

<body class="bg-gradient min-h-screen">

<header class="bg-white p-4 shadow-sm flex justify-between items-center">
<div class="text-3xl font-bold text-blue-800">BRUSH</div>

<nav class="flex gap-4 text-blue-800 text-xl">
<a href="feed.html">🏠</a>
<a href="subir.html">➕</a>
<a href="favoritos.html">❤️</a> 
<a href="likes.html">⭐</a>      
<a href="configuracion.html">⚙️</a>
</nav>
</header>

<main class="p-6">

<section class="flex flex-col md:flex-row gap-6 bg-white/90 shadow-sm rounded-lg p-6 items-center">
<img src="vany.jpeg" class="rounded-full w-28 h-28 border-4 border-blue-700 object-cover" />
<div>
<h2 class="text-2xl font-semibold text-blue-800">Testervany234</h2>
<p class="text-gray-700">Artista universitario apasionado por la pintura y la fotografía. (Soltero)</p>

<div class="flex gap-6 mt-3 text-gray-800 text-sm">
<span><strong>10</strong> publicaciones</span>
<span><strong>300</strong> seguidores</span>
<span><strong>250</strong> seguidos</span>
</div>
</div>
</section>

<section class="mt-8">
<h3 class="text-xl text-white mb-4 font-semibold">Publicaciones</h3>

<div id="postGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>

</section>

</main>



<div id="imageModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 
    flex items-center justify-center">

    <div id="modalContent" 
         class="relative flex flex-col gap-4 items-center justify-center w-full h-full opacity-0 scale-90 transition-all duration-200">

        <button id="closeBtn"
            class="absolute top-6 right-6 text-white text-3xl font-bold bg-black/30 rounded-full p-2 
                   hover:scale-110 transition">
            ×
        </button>

        <img id="modalImage" 
            class="max-w-[90%] max-h-[70%] rounded-lg shadow-lg border-4 border-white object-contain" />

        
        <div class="flex gap-6 text-white text-3xl">
            
            <span id="likeBtn" class="cursor-pointer select-none">✩</span>

            
            <span id="favBtn" class="cursor-pointer select-none">🤍</span>

            
            <span id="commentToggle" class="cursor-pointer select-none">💬</span>
        </div>

        
        <div id="likeCount" class="text-white text-lg"></div>

        
        <div id="commentBox" class="hidden w-full max-w-xl bg-white/90 p-4 rounded-lg">
            <h4 class="font-bold mb-2">Comentarios</h4>
            <div id="commentList" class="max-h-40 overflow-y-auto mb-3 text-black"></div>

            <div class="flex gap-2">
                <input id="commentInput" 
                       class="flex-1 border rounded p-2 text-black" 
                       placeholder="Escribe un comentario..." />
                <button id="sendComment" class="bg-blue-800 text-white px-4 py-2 rounded">
                    Enviar
                </button>
            </div>
        </div>

    </div>
</div>

<script>

const posts = [
    { id:1, src:"https://images.unsplash.com/photo-1629977681402-c7db16d6c6d1?fm=jpg&q=60&w=3000" },
    { id:2, src:"https://cdna.artstation.com/p/assets/images/images/092/212/924/large/fusion-phobia-shinobi-koi-color.webp" },
    { id:3, src:"https://cdnb.artstation.com/p/assets/images/images/092/992/365/large/daniela-flower-galaxy-girl-sketch.webp" },
    { id:4, src:"https://cdna.artstation.com/p/assets/images/images/093/080/478/medium/aung-ko-zin-bird-copy.webp" },
    { id:5, src:"https://cdnb.artstation.com/p/assets/images/images/093/080/487/medium/aung-ko-zin-reptile-2-copy.webp" },
    { id:6, src:"https://cdna.artstation.com/p/assets/images/images/093/080/496/medium/aung-ko-zin-insect.webp" },
    { id:7, src:"https://cdnb.artstation.com/p/assets/images/images/078/230/985/medium/dolly-chris-20240721212128.jpg" },
    { id:8, src:"https://cdnb.artstation.com/p/assets/images/images/073/453/663/medium/dolly-chris-psc-3.jpg" },
    { id:9, src:"https://cdnb.artstation.com/p/assets/images/images/072/924/621/medium/dolly-chris-20240221210029.jpg" },
    { id:10, src:"https://cdnb.artstation.com/p/assets/images/images/072/884/435/medium/dolly-chris-20240220202454.jpg" }
];


const grid = document.getElementById("postGrid");
posts.forEach(p => {
    const img = document.createElement("img");
    img.src = p.src;
    img.className = "rounded-lg shadow-sm aspect-square object-cover cursor-pointer";
    img.onclick = () => openImage(p.id);
    grid.appendChild(img);
});



let data = JSON.parse(localStorage.getItem("brushData")) || {};

function save() {
    localStorage.setItem("brushData", JSON.stringify(data));
}

function getPostData(id) {
    if (!data[id]) data[id] = { likes:0, liked:false, fav:false, comments:[] };
    return data[id];
}


const modal = document.getElementById("imageModal");
const img = document.getElementById("modalImage");
const content = document.getElementById("modalContent");
const closeBtn = document.getElementById("closeBtn");

const likeBtn = document.getElementById("likeBtn");     // ⭐
const favBtn = document.getElementById("favBtn");       // ❤️
const likeCount = document.getElementById("likeCount");

const commentBox = document.getElementById("commentBox");
const commentToggle = document.getElementById("commentToggle");
const commentList = document.getElementById("commentList");
const commentInput = document.getElementById("commentInput");
const sendComment = document.getElementById("sendComment");

let currentPost = null;

window.openImage = function(id) {
    currentPost = getPostData(id);

    const p = posts.find(x => x.id === id);
    img.src = p.src;

    modal.classList.remove("hidden");

    setTimeout(() => {
        content.classList.remove("opacity-0", "scale-90");
    }, 10);

    renderInfo();
};

function renderInfo() {
   
    likeBtn.textContent = currentPost.liked ? "⭐" : "✩";

    
    favBtn.textContent = currentPost.fav ? "❤️" : "🤍";

    likeCount.textContent = `${currentPost.likes} me gusta`;

    commentList.innerHTML = currentPost.comments
        .map(c => `<p>• ${c}</p>`)
        .join("");
}

closeBtn.onclick = closeModal;
modal.onclick = e => { if (e.target === modal) closeModal(); };

function closeModal() {
    content.classList.add("opacity-0", "scale-90");
    setTimeout(() => modal.classList.add("hidden"), 150);
}




likeBtn.onclick = () => {
    currentPost.liked = !currentPost.liked;
    currentPost.likes += currentPost.liked ? 1 : -1;
    save();
    renderInfo();
};


favBtn.onclick = () => {
    currentPost.fav = !currentPost.fav;
    save();
    renderInfo();
};


commentToggle.onclick = () => {
    commentBox.classList.toggle("hidden");
};

sendComment.onclick = () => {
    if (commentInput.value.trim() === "") return;
    currentPost.comments.push(commentInput.value.trim());
    commentInput.value = "";
    save();
    renderInfo();
    commentBox.classList.remove("hidden");
};
</script>

</body>
</html>
