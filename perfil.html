<!--      MODAL CON BOTÓN X       -->
<!-- ============================= -->

<div id="imageModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 
    flex items-center justify-center">

    <!-- Botón X -->
    <button onclick="closeModal()"
        class="absolute top-4 right-4 text-white text-4xl font-bold 
               hover:scale-110 transition">
        ×
    </button>

    <div id="modalContent" 
        class="flex items-center justify-center w-full h-full opacity-0 scale-90 transition-all duration-200">
        
        <img id="modalImage" 
            class="max-w-[90%] max-h-[90%] rounded-lg shadow-lg border-4 border-white object-contain" />
    </div>
</div>

<script>
function openImage(src) {
    const modal = document.getElementById("imageModal");
    const content = document.getElementById("modalContent");
    const img = document.getElementById("modalImage");

    img.src = src;
    modal.classList.remove("hidden");

    // Animación entrada
    setTimeout(() => {
        content.classList.remove("opacity-0", "scale-90");
        content.classList.add("opacity-100", "scale-100");
    }, 10);
}

// cerrar modal con el botón X
function closeModal() {
    const modal = document.getElementById("imageModal");
    const content = document.getElementById("modalContent");

    // Animación salida
    content.classList.add("opacity-0", "scale-90");
    content.classList.remove("opacity-100", "scale-100");

    setTimeout(() => {
        modal.classList.add("hidden");
    }, 150);
}

// cerrar haciendo click en el fondo
document.getElementById("imageModal").addEventListener("click", function(e) {
    if (e.target === this) {
        closeModal();
    }
});
</script>
