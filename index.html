<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUSH – Redirigiendo…</title>

    <!-- Estilos minimalistas -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #64748b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }

        .container {
            backdrop-filter: blur(6px);
            background: rgba(255, 255, 255, 0.15);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            opacity: 0.9;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #ffffff;
            color: #1e3a8a;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #cbd5e1;
        }
    </style>

    <!-- Redirección automática -->
    <script>
        setTimeout(() => {
            window.location.href = "feed.html"; // Cambia a tu archivo real
        }, 1500);
    </script>

</head>
<body>

    <div class="container">
        <h1>BRUSH</h1>
        <p>Cargando la galería…</p>
        <p>Si no eres redirigido automáticamente, haz clic aquí:</p>
        <a href="feed.html">Ir al Feed</a>
    </div>

</body>
</html>
