<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brush | Iniciar Sesión</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Times New Roman', serif; }
.bg-gradient { background: linear-gradient(135deg, #1e3a8a, #64748b); }
</style>
</head>

<body class="bg-gradient min-h-screen flex items-center justify-center">
<div class="bg-white/90 rounded-xl shadow-sm p-8 w-full max-w-md text-center">

<div class="mb-6">
<div class="text-4xl font-bold text-blue-800 tracking-wide">BRUSH</div>
<div class="text-gray-500 text-sm mt-1">Red social universitaria de arte</div>
</div>

<form action="feed.html" class="space-y-4">
<input type="text" placeholder="Teléfono, correo o usuario" class="w-full px-4 py-2 border rounded-md focus:ring focus:ring-blue-300" />
<input type="password" placeholder="Contraseña" class="w-full px-4 py-2 border rounded-md focus:ring focus:ring-blue-300" />

<button class="w-full bg-blue-700 text-white py-2 rounded-md font-semibold hover:bg-blue-800 transition">Iniciar sesión</button>
</form>

<div class="mt-4 text-sm text-blue-700 hover:underline cursor-pointer">¿Olvidaste tu contraseña?</div>

<div class="mt-6 text-gray-700 text-sm">
¿No tienes una cuenta?
<a href="registro.html" class="text-blue-700 font-semibold hover:underline">Regístrate</a>
</div>

</div>
</body>
</html>
