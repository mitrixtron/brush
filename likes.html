<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUSH – Likes</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #1e3a8a, #64748b);
            color: white;
        }

        header {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        a.btn-back {
            color: #fff;
            background: rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .like-item {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            backdrop-filter: blur(8px);
        }

        .like-item strong {
            color: #dbeafe;
        }
    </style>
</head>

<body>

<header>
    <h1>Mis Likes</h1>
    <a class="btn-back" href="feed.html">⟵ Volver al Feed</a>
</header>

<div class="container">

    <div class="like-item">
        <strong>Tú</strong> diste like a:  
        <p>“Atardecer Azulado”</p>
    </div>

    <div class="like-item">
        <strong>Tú</strong> diste like a:  
        <p>“Ilustración Nocturna”</p>
    </div>

</div>

</body>
</html>
